<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      color: #E8D5B7;
      margin: 0;
      padding: 0;
      background: transparent;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    button {
      background: #16213E;
      color: #E8D5B7;
      border: 1px solid #C8A27A;
      border-radius: 8px;
      padding: 8px 16px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }
    button:hover {
      box-shadow: 0 0 8px rgba(200,162,122,0.4);
    }
    input {
      background: #16213E;
      color: #E8D5B7;
      border: 1px solid #C8A27A;
      border-radius: 8px;
      padding: 8px 12px;
      width: 80px;
      font-family: 'Inter', sans-serif;
    }
    input::placeholder {
      color: #9E9EB8;
    }
  </style>
</head>
<body>
  <span>Add a Tip:</span>
  <button id="btn-10">10%</button>
  <button id="btn-15">15%</button>
  <button id="btn-20">20%</button>
  <input type="number" id="custom-tip" placeholder="Custom %" min="0">

  <script src="./index.js"></script>
</body>
</html>
